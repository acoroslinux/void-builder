---
# Configure final Void Linux target hooks (runit services, dracut, locales, hosts, cleanup, permissions)
dontChroot: false
timeout: 600
script:
    - command: "mkdir -p /etc/runit/runsvdir/default"
    - command: "for srv in dbus NetworkManager polkitd bluetoothd cupsd avahi-daemon sshd chronyd alsa acpid elogind ufw tlp; do [ -d /etc/sv/$srv ] && ln -sf /etc/sv/$srv /etc/runit/runsvdir/default/$srv; done"
    - command: "LOC=$(cat /etc/locale.conf 2>/dev/null | grep LANG= | cut -d= -f2) && [ -n \"$LOC\" ] && sed -i \"s|^#\\s*\\(${LOC}\\)|\\1|\" /etc/default/libc-locales || true"
    - command: "/usr/bin/xbps-reconfigure -f glibc-locales 2>/dev/null || true"
    - command: "HNAME=$(cat /etc/hostname 2>/dev/null || echo void-installed) && echo -e \"127.0.0.1\\tlocalhost\\n::1\\t\\tlocalhost ip6-localhost ip6-loopback\\n127.0.1.1\\t$HNAME.localdomain $HNAME\" > /etc/hosts"
    - command: "rm -f /etc/sudoers.d/99-void-live /etc/default/live.conf /etc/xdg/autostart/create-install-icon.desktop /usr/share/applications/calamares.desktop"
    - command: "rm -rf /usr/lib/dracut/modules.d/01vmklive"
    - command: "[ -f /etc/sv/agetty-tty1/conf ] && sed -i 's,GETTY_ARGS=.*,GETTY_ARGS=\"--noclear\",g' /etc/sv/agetty-tty1/conf || true"
    - command: "chmod 600 /etc/shadow 2>/dev/null; chmod 644 /etc/passwd /etc/group 2>/dev/null; [ -f /etc/gshadow ] && chmod 600 /etc/gshadow 2>/dev/null; chmod 440 /etc/sudoers 2>/dev/null; [ -d /etc/sudoers.d ] && chmod 750 /etc/sudoers.d && chmod 440 /etc/sudoers.d/* 2>/dev/null || true"
    - command: "[ -f /usr/bin/plymouth-set-default-theme ] && echo 'add_dracutmodules+=\" plymouth \"' > /etc/dracut.conf.d/plymouth.conf || true"
    - command: "/usr/bin/xbps-reconfigure -fa"

